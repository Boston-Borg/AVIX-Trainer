# Render Blueprint — https://render.com/docs/blueprint-spec
# Push this repo to GitHub, then on Render click "New +" → "Blueprint" and
# point it at the repo. Render reads this file and creates the service.
#
# IMPORTANT: ANTHROPIC_API_KEY is intentionally NOT in this file. After the
# service is created, go to its dashboard → Environment → add a secret called
# ANTHROPIC_API_KEY with your real key. That keeps the key out of git.

services:
  - type: web
    name: avx
    runtime: python
    plan: starter             # $7/mo — stays warm 24/7, no cold starts
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false           # forces you to set it in the dashboard, never in git

  # ---------------------------------------------------------------------------
  # Daily cleanup cron job — runs at 02:00 UTC every day.
  #
  # Runs cleanup.py directly (no HTTP round-trip, no dependency on the web
  # service being warm). Needs only the two Supabase vars below — set them in
  # Render dashboard → avx-cleanup → Environment after the first deploy.
  #
  # Optional threshold overrides (also set in dashboard if needed):
  #   CLEANUP_CHAT_DAYS   (default 30)
  #   CLEANUP_TRIAL_DAYS  (default 60)
  #   CLEANUP_ORAL_DAYS   (default 90)
  #   CLEANUP_BATCH_SIZE  (default 500)
  # ---------------------------------------------------------------------------
  - type: cron
    name: avx-cleanup
    runtime: python
    schedule: "0 2 * * *"    # 2:00 AM UTC daily
    buildCommand: pip install -r requirements.txt
    startCommand: python cleanup.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SUPABASE_URL
        sync: false           # set in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false           # set in Render dashboard
